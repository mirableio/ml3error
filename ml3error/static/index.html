<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ml3error</title>
<style>
:root {
    --color-text: #222;
    --color-muted: #888;
    --color-border: #ddd;
    --color-bg: #fafafa;
    --color-card: #fff;
    --color-hover: #f1f3f5;
    --color-accent: #dc3545;
    --color-resolved: #6c757d;
    --color-tag-bg: #f1f3f5;
    --color-btn: #f8f9fa;
    --color-btn-hover: #e9ecef;
}
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--color-bg);
    color: var(--color-text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
h1 {
    margin: 0 0 10px 0;
    font-size: 20px;
    font-weight: 600;
}
.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.filter-btn {
    padding: 6px 12px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    background: var(--color-card);
    cursor: pointer;
    font-size: 13px;
}
.filter-btn.active {
    background: var(--color-text);
    color: white;
    border-color: var(--color-text);
}
input[type="text"] {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 13px;
    flex: 1;
    max-width: 400px;
}
.count {
    color: var(--color-muted);
    font-size: 13px;
    margin-left: auto;
}
#list {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 4px;
    padding: 10px;
    background: var(--color-card);
}
.entry {
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-accent);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--color-card);
    position: relative;
    transition: background 0.1s;
}
.count-tag {
    background: var(--color-accent);
    color: white;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    min-width: 22px;
    text-align: center;
}
.entry.resolved .count-tag { background: var(--color-resolved); }
.fp-hash {
    text-align: right;
    color: var(--color-muted);
    opacity: 0.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    margin-top: 8px;
    user-select: all;
}
.fp-hash:hover { opacity: 1; }
.fp-hash .fp-label { margin-right: 4px; }
.entry.resolved {
    border-left-color: var(--color-resolved);
    opacity: 0.75;
}
.entry:hover { background: var(--color-hover); }
.entry-head {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}
.exc {
    font-weight: 600;
    color: var(--color-accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
}
.entry.resolved .exc { color: var(--color-resolved); }
.loc {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--color-muted);
}
.tag {
    background: var(--color-tag-bg);
    color: var(--color-text);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.spacer { flex: 1; }
.when {
    color: var(--color-muted);
    font-size: 12px;
    white-space: nowrap;
}
.btn {
    padding: 4px 10px;
    border: 1px solid var(--color-border);
    border-radius: 3px;
    background: var(--color-btn);
    cursor: pointer;
    font-size: 12px;
    color: var(--color-text);
}
.btn:hover { background: var(--color-btn-hover); }
.details {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--color-border);
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--color-text);
    line-height: 1.6;
}
.entry.open .details { display: block; }
.details .k { color: var(--color-muted); display: inline-block; width: 110px; }
.details .muted { color: var(--color-muted); }
.details pre {
    margin: 8px 0 0 0;
    padding: 10px;
    background: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.45;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
}
.details .section-label {
    color: var(--color-muted);
    font-size: 11px;
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.empty {
    color: var(--color-muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
}
</style>
</head>
<body>
<h1>ml3error</h1>
<div class="controls">
    <button class="filter-btn active" data-filter="unresolved">Unresolved</button>
    <button class="filter-btn" data-filter="resolved">Resolved</button>
    <button class="filter-btn" data-filter="all">All</button>
    <input type="text" id="search" placeholder="filter by type / path / function">
    <div class="count" id="count"></div>
</div>
<div id="list"></div>
<script src="/static/script.js"></script>
</body>
</html>
