[project]
name = "ml3error"
version = "0.1.0"
description = "Lightweight error notifier for hobby Python projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "notifiers>=1.3.6",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]

[project.scripts]
ml3error = "ml3error.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
